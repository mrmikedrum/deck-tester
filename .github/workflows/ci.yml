name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    # Every test, the engine's real games included: Forge builds at the pin in under a minute.
    runs-on: ubuntu-24.04   # Python 3.9 has no build for newer Ubuntu
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: scripts/bootstrap-forge.sh
      - run: python -m unittest discover -s tests -v

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Scripts parse
        run: for f in game/client/*.js game/tools/*.js; do node --check "$f"; done
      - name: Every file a page loads exists
        run: |
          node -e '
          const fs = require("fs"), path = require("path"); let bad = 0;
          for (const h of fs.readdirSync("game/client").filter(f => f.endsWith(".html")))
            for (const m of fs.readFileSync("game/client/" + h, "utf8").matchAll(/(?:src|href)="([^"]+)"/g))
              if (!/^https?:/.test(m[1]) && !fs.existsSync(path.join("game/client", m[1]))) { console.log(h + ": missing " + m[1]); bad++; }
          process.exit(bad ? 1 : 0);'

  agent:
    # The deck partner's tools: the ManaBox integration (Node and Python) and the deck audit.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: npm ci --prefix agent/integrations/manabox && npm test --prefix agent/integrations/manabox
      - run: python -m unittest discover -s agent/integrations/manabox/python -p 'test_*.py'
      - run: python -m unittest discover -s agent/tools/deck-audit/test
