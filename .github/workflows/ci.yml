name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    # Every test, the engine's real games included: Forge builds at the pin in under a minute.
    runs-on: ubuntu-24.04   # Python 3.9 has no build for newer Ubuntu
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: scripts/bootstrap-forge.sh
      - run: python -m unittest discover -s tests -v

  client:
    runs-on: ubuntu-24.04   # Playwright 1.48 installs browser dependencies for 24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: game/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Old client scripts parse
        run: for f in client/*.js tools/*.js; do node --check "$f"; done
      - name: Tools' tests (the packet's layout verdict)
        run: node --test "tools/*.test.js"
      - name: Every file the old pages load exists
        run: |
          node -e '
          const fs = require("fs"), path = require("path"); let bad = 0;
          for (const h of ["live.html", "offline.html"])
            for (const m of fs.readFileSync("client/" + h, "utf8").matchAll(/(?:src|href)="([^"]+)"/g))
              if (!/^https?:/.test(m[1]) && !fs.existsSync(path.join("client", m[1]))) { console.log(h + ": missing " + m[1]); bad++; }
          process.exit(bad ? 1 : 0);'
      - run: npx playwright install --with-deps chromium webkit
      - name: The behaviour suite on the new entry
        # The client all work builds on. The current client, the rollback until cutover, runs its suite locally: on
        # this runner's software rendering some of its snapshots take longer than the harness waits.
        run: npm run behaviour -- autopass.spec.js -g 'with only pass on offer' --workers=1 --reporter=line
        env:
          BEHAVIOUR_CLIENT: new
          BEHAVIOUR_TIMING: "1"
          DEBUG: pw:browser
      - name: The new entry's cast subset, on Chromium and WebKit
        # The built entry (npm run build above) on the same specs, through window.__deckmaster: the tests tagged @cast.
        run: npx playwright test -c tools/behaviour --grep @cast
        env:
          BEHAVIOUR_CLIENT: new
          BEHAVIOUR_BROWSERS: chromium,webkit

  agent:
    # The deck partner's Python tools: Scryfall search/cache and the deck audit.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: python -m unittest discover -s agent/skills/commander-search/scripts -p 'test_*.py'
      - run: python -m unittest discover -s agent/tools/deck-audit/test
