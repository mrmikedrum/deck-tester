name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    # Every test, the engine's real games included: Forge builds at the pin in under a minute.
    runs-on: ubuntu-24.04   # Python 3.9 has no build for newer Ubuntu
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: scripts/bootstrap-forge.sh
      - run: python -m unittest discover -s tests -v

  client:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: game/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Client tools' tests
        run: node --test tools/*.test.js
      # The browser behaviour suite runs locally (`npm run check` in game/): GitHub's runners render in software,
      # too slowly for it, and the client's targets are iPad and desktop browsers.

  agent:
    # The deck partner's Python tools: Scryfall search/cache and the deck audit.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: python -m unittest discover -s agent/skills/commander-search/scripts -p 'test_*.py'
      - run: python -m unittest discover -s agent/tools/deck-audit/test
