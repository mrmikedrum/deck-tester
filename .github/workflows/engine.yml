name: Engine

# The engine tests play real games, so they need Forge built at the pin with the patch series: too slow for every
# pull request. They run nightly and on demand (Actions, Engine, Run workflow).
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: scripts/bootstrap-forge.sh
      - run: python -m unittest discover -s tests -v
