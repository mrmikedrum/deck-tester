<title>Deckmaster · Offline board</title>
<!-- The board alone, on the fixture game in data.js and the scenarios in scenarios.js, for the tools (no engine). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=IM+Fell+English:ital@0;1&display=swap">

</head><body>
<!-- The scripts run in <body>: h.js observes document.body and the mount appends to it, so it must exist. -->
<script src="data.js"></script>
<script src="common.js"></script>
<script src="table-kit.js"></script>
<script src="scenarios.js"></script>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
<script src="world.js"></script>
<script src="fx.js"></script>
<script src="h.js"></script>
<script>
(function () {
  const def = Proto.protos.find(p => p.key === "h");
  const stage = document.createElement("div");
  stage.className = "stage proto-h";
  document.body.appendChild(stage);
  def.mount(stage);
  requestAnimationFrame(() => def.show());
  addEventListener("resize", () => def.show());
  document.addEventListener("gesturestart", e => e.preventDefault());
})();
</script>
</body></html>
