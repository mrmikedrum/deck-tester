<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>

<script>
(function () {
  const stages = {}, nav = document.getElementById("switcher");
  let current = null;
  function show(key) {
    const def = Proto.protos.find(p => p.key === key) || Proto.protos[0];
    if (!def) return;
    if (current && current.hide) current.hide();
    Object.values(stages).forEach(s => (s.hidden = true));
    if (!stages[def.key]) {
      const s = document.createElement("div");
      s.className = "stage proto-" + def.key;
      document.body.insertBefore(s, nav);
      stages[def.key] = s;
      def.mount(s);
    }
    stages[def.key].hidden = false;
    Proto.clearArrows();
    current = def;
    if (def.show) requestAnimationFrame(() => def.show());
    nav.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.key === def.key));
    try { history.replaceState(null, "", "#" + def.key); } catch (e) {}
  }
  Proto.protos.forEach(p => {
    const b = document.createElement("button");
    b.textContent = p.title;
    b.dataset.key = p.key;
    b.addEventListener("click", () => { if (!nav.classList.contains("open")) { nav.classList.add("open"); return; } nav.classList.remove("open"); show(p.key); });
    nav.appendChild(b);
  });
  addEventListener("resize", () => { if (current && current.show) current.show(); });
  document.addEventListener("gesturestart", e => e.preventDefault());
  show((location.hash || "").slice(1));
  addEventListener("hashchange", () => { const k = location.hash.slice(1); if (!current || current.key !== k) show(k); });
})();
</script>
